name: Apply chat UI enhancements
on:
  push:
    paths:
      - '.github/workflows/apply-chat-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.bubble{max-width:76%;padding:11px 14px;border-radius:18px;background:#f0e4d8;white-space:pre-wrap;word-break:break-word;position:relative}'
          new='.bubble{max-width:76%;padding:11px 14px;border-radius:18px;background:#f0e4d8;white-space:pre-wrap;word-break:break-word;position:relative;border:1px solid rgba(110,91,76,.18);box-shadow:0 3px 10px rgba(76,59,45,.10)}'
          if old in s: s=s.replace(old,new,1)
          old2='.me .bubble{background:#dfeade}'
          new2='.me .bubble{background:#dfeade;border-color:rgba(78,105,78,.18);box-shadow:0 3px 10px rgba(64,88,64,.10)}'
          if old2 in s: s=s.replace(old2,new2,1)
          marker='function addMessage(m){const row='
          if marker in s and 'function formatMessageTime' not in s:
            prefix='function formatMessageTime(t){const d=new Date(t);return d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit",hour12:true})}function formatMessageDate(t){const d=new Date(t);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}let lastMessageDate="";'
            s=s.replace(marker,prefix+marker,1)
            old3='const b=document.createElement(\'div\');b.className=\'bubble\';'
            new3='const dkey=new Date(m.time).toLocaleDateString("ko-KR");if(dkey!==lastMessageDate){const div=document.createElement("div");div.className="date-divider";div.textContent=formatMessageDate(m.time);messages.append(div);lastMessageDate=dkey}const b=document.createElement(\'div\');b.className=\'bubble\';'
            s=s.replace(old3,new3,1)
            old4='if(m.name===me){const del=document.createElement(\'button\');'
            new4='const meta=document.createElement("div");meta.className="msg-meta";meta.textContent=formatMessageTime(m.time);b.append(meta);if(m.name===me){const del=document.createElement(\'button\');'
            s=s.replace(old4,new4,1)
          css=' .msg-meta{font-size:10px;color:#9a897c;margin-top:5px;line-height:1;text-align:right}.date-divider{display:flex;align-items:center;gap:10px;margin:22px 0 12px;color:#9a897c;font-size:11px;justify-content:center}.date-divider:before,.date-divider:after{content:"";height:1px;background:rgba(154,137,124,.25);width:30%}'
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'feat: show chat dates and times'
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/apply-chat-ui.yml
          git add .github/workflows/apply-chat-ui.yml
          git commit -m 'chore: remove one-shot patch workflow'
          git push