name: Apply chat scroll fix

on:
  push:
    paths:
      - '.github/workflows/fix-chat-scroll.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'let lastMessageDate="";function addMessage(m){'
          new = '''let lastMessageDate="";function scrollToLatest(){messages.scrollTop=messages.scrollHeight;requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight;requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight})})}function addMessage(m){'''
          if old not in s:
              raise SystemExit('target addMessage marker not found')
          s = s.replace(old, new, 1)
          old2 = 'row.append(b);messages.append(row);messages.scrollTop=messages.scrollHeight}'
          new2 = 'row.append(b);messages.append(row);scrollToLatest()}'
          if old2 not in s:
              raise SystemExit('target scroll line not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: focus chat on latest message" || true
          rm -f .github/workflows/fix-chat-scroll.yml
          git add -u .github/workflows/fix-chat-scroll.yml
          git commit -m "chore: remove one-time scroll workflow" || true
          git push