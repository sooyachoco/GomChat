<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111a36"/>
    <stop offset="0.48" stop-color="#24365a"/>
    <stop offset="0.78" stop-color="#52647d"/>
    <stop offset="1" stop-color="#8a7780"/>
  </linearGradient>
  <radialGradient id="glow" cx="72%" cy="25%" r="38%">
    <stop offset="0" stop-color="#dce9ff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#dce9ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2638"/>
    <stop offset="1" stop-color="#0b111c"/>
  </linearGradient>
  <filter id="moonGlow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="900" height="1400" fill="url(#sky)"/>
<rect width="900" height="1400" fill="url(#glow)"/>
<!-- soft moon glow and crescent -->
<circle cx="705" cy="260" r="92" fill="#dbe8ff" opacity=".12" filter="url(#moonGlow)"/>
<circle cx="705" cy="260" r="54" fill="#fff7df" opacity=".95"/>
<circle cx="728" cy="244" r="54" fill="#182542"/>
<!-- stars -->
<g fill="#fff" opacity=".82">
 <circle cx="92" cy="154" r="2.2"/><circle cx="170" cy="282" r="1.5"/><circle cx="268" cy="112" r="1.8"/>
 <circle cx="350" cy="228" r="1.3"/><circle cx="438" cy="92" r="2.1"/><circle cx="526" cy="170" r="1.4"/>
 <circle cx="602" cy="76" r="1.8"/><circle cx="808" cy="116" r="2.1"/><circle cx="850" cy="338" r="1.5"/>
 <circle cx="112" cy="432" r="1.6"/><circle cx="238" cy="380" r="1.2"/><circle cx="474" cy="354" r="1.8"/>
 <circle cx="566" cy="430" r="1.2"/><circle cx="782" cy="456" r="1.8"/><circle cx="660" cy="530" r="1.2"/>
</g>
<g fill="#fff" opacity=".42"><circle cx="135" cy="90" r="1"/><circle cx="310" cy="318" r="1"/><circle cx="735" cy="80" r="1"/><circle cx="820" cy="240" r="1"/><circle cx="390" cy="460" r="1"/></g>
<!-- distant soft clouds -->
<g fill="#b9c4d5" opacity=".09">
 <ellipse cx="180" cy="560" rx="150" ry="35"/><ellipse cx="310" cy="548" rx="120" ry="28"/>
 <ellipse cx="690" cy="640" rx="190" ry="38"/><ellipse cx="790" cy="625" rx="130" ry="26"/>
</g>
<!-- distant hills -->
<path d="M0 1030 C120 940 205 980 310 900 C420 815 520 960 625 890 C720 827 795 930 900 850 L900 1400 L0 1400Z" fill="#202c40" opacity=".72"/>
<path d="M0 1120 C140 1025 260 1080 370 990 C485 900 565 1040 690 970 C770 925 840 1010 900 970 L900 1400 L0 1400Z" fill="url(#ground)"/>
<!-- tiny warm lights -->
<g fill="#f5d99b" opacity=".7"><circle cx="150" cy="1125" r="2"/><circle cx="165" cy="1120" r="1.5"/><circle cx="740" cy="1080" r="2"/><circle cx="760" cy="1076" r="1.5"/></g>
</svg>