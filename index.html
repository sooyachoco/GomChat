<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>편안하게 대화해요</title><style>body{margin:0;background:#eee5da;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#463b34}.app{max-width:520px;height:100dvh;margin:auto;background:#fffaf5;display:flex;flex-direction:column}.app.embedded .top{display:none}.top{height:72px;box-sizing:border-box;padding:0 18px;background:#fff8f0;border-bottom:1px solid #eee1d5;display:flex;align-items:center;justify-content:center}.title{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800}.connection-dot{width:12px;height:12px;border-radius:50%;background:#38b96b;display:inline-block;box-shadow:0 0 0 3px rgba(56,185,107,.12);transition:.2s}.connection-dot.offline{background:#e05252;box-shadow:0 0 0 3px rgba(224,82,82,.12)}.push-btn{border:0;background:transparent;color:#806b5d;font-size:18px;padding:5px;cursor:pointer}.messages{flex:1;overflow:auto;padding:20px 16px;background-image:linear-gradient(rgba(255,250,245,.52),rgba(255,250,245,.52)),url("./day-background.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}.row{display:flex;justify-content:flex-start;margin:10px 0;gap:6px;position:relative}.row.me{justify-content:flex-end}.bubble{max-width:76%;padding:11px 14px;border-radius:18px;background:#f0e4d8;white-space:pre-wrap;word-break:break-word;position:relative;border:1px solid rgba(110,91,76,.18);box-shadow:0 3px 10px rgba(76,59,45,.10)}.me .bubble{background:#dfeade;border-color:rgba(78,105,78,.18);box-shadow:0 3px 10px rgba(64,88,64,.10)}.bubble a{color:#7355a0;text-decoration:underline}.bubble img{display:block;max-width:100%;max-height:420px;border-radius:12px}.chat-media{display:block;width:min(100%,360px);max-height:360px;margin:2px 0 5px;border-radius:12px}.delete-btn{display:none;position:absolute;top:-25px;right:0;background:#fff;border:1px solid #e5d9cf;border-radius:10px;padding:4px 8px;font-size:11px;color:#806b5d;box-shadow:0 2px 8px rgba(0,0,0,.08)}.me .bubble:hover .delete-btn,.me .bubble:focus-within .delete-btn{display:block}.inputbar{display:flex;gap:7px;padding:10px;background:#fff;border-top:1px solid #eee3da}.inputbar textarea{flex:1;min-width:0;border:1px solid #e4d9ce;border-radius:24px;padding:13px;resize:none;overflow-y:auto;max-height:120px;line-height:1.4;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}.inputbar textarea::-webkit-scrollbar{display:none}.inputbar button{width:48px;height:48px;border:0;border-radius:50%;background:#85705f;color:white;font-size:20px}.attach{background:#ead8c3!important;color:#6e5a4c!important}.preview{display:none;padding:8px 12px;background:white}.preview.show{display:block}.preview img{width:70px;height:70px;object-fit:cover;border-radius:10px}.login{position:fixed;inset:0;background:#fffaf5;display:grid;place-items:center}.card{padding:30px;background:white;border-radius:24px;text-align:center}.card input{padding:12px;border:1px solid #ddd;border-radius:10px}.card button{padding:12px;margin-top:8px;border:0;border-radius:10px;background:#85705f;color:white}.hidden{display:none!important} .msg-meta{font-size:10px;color:#9a897c;margin-top:5px;line-height:1;text-align:right}.date-divider{display:flex;align-items:center;gap:10px;margin:22px 0 12px;color:#9a897c;font-size:11px;justify-content:center}.date-divider:before,.date-divider:after{content:"";height:1px;background:rgba(255,255,255,.7);width:30%}</style></head><body><div id="login" class="login"><div class="card"><div>🐻</div><h2>편안하게 대화해요</h2><input id="nickname" maxlength="20" placeholder="닉네임"><button id="enter">입장하기</button></div></div><div class="app"><header class="top"><div class="title"><span>편안하게 대화해요</span><span id="connectionDot" class="connection-dot offline" title="연결 상태"></span><button id="pushBtn" class="push-btn hidden" type="button" title="알림 켜기">🔔</button></div></header><main id="messages" class="messages"></main><div id="preview" class="preview"><img id="previewImg"><button id="removeImage">×</button></div><form id="form" class="inputbar"><button type="button" class="attach" id="attach">＋</button><textarea id="text" rows="1" autocomplete="off" placeholder="메시지를 남겨보세요"></textarea><button type="submit">➤</button><input id="file" type="file" accept="image/*,audio/mpeg,audio/mp3,video/mp4" hidden></form></div><script>const API='https://gomchat.sooyachoco.workers.dev',VAPID_PUBLIC_KEY='BL5LUBf4e-W9O2qUJuvnOtUhfhKB8jcJoP30P8R-OWOBJvMPcTZxcQf-bergpsJ5TanPJ597NtVuOv9ldqjrPUE';let me=localStorage.getItem('gomchat-name')||'',socket=null,pendingImage='',pendingMedia='';const $=s=>document.querySelector(s),login=$('#login'),name=$('#nickname'),messages=$('#messages'),dot=$('#connectionDot'),text=$('#text'),file=$('#file'),preview=$('#preview'),previewImg=$('#previewImg'),pushBtn=$('#pushBtn');const embedded=new URLSearchParams(location.search).get('embed')==='1'||document.referrer.includes('community.sooyachoco.workers.dev');if(embedded)document.querySelector('.app').classList.add('embedded');function setConnection(ok){dot.classList.toggle('offline',!ok);dot.title=ok?'실시간 연결됨':'연결 안됨'}function linkify(s){const frag=document.createDocumentFragment(),re=/https?:\/\/[^\s<]+/gi;let last=0,m;while((m=re.exec(s))){frag.append(document.createTextNode(s.slice(last,m.index)));const a=document.createElement('a');a.href=m[0];a.textContent=m[0];a.target='_blank';a.rel='noopener noreferrer';frag.append(a);last=m.index+m[0].length}frag.append(document.createTextNode(s.slice(last)));return frag}function formatMessageTime(t){const d=new Date(t);return d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit",hour12:true})}function canEditDelete(t){const d=Date.parse(t||"");return Number.isFinite(d)&&Date.now()-d<=10*60*1000}function formatMessageDate(t){const d=new Date(t);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}let lastMessageDate="";function scrollToLatest(){messages.scrollTop=messages.scrollHeight;requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight;requestAnimationFrame(()=>{messages.scrollTop=messages.scrollHeight})})}function addMedia(parent,m){if(!m.media)return;const type=m.media.slice(5,m.media.indexOf(';')).toLowerCase();let el;if(type==='video/mp4'||type==='audio/mp4'){el=document.createElement('video');el.controls=true;el.playsInline=true}else{el=document.createElement('audio');el.controls=true}el.src=m.media;el.preload='metadata';el.className='chat-media';parent.append(el)}function addMessage(m){const row=document.createElement('div');row.className='row '+(m.name===me?'me':'');row.dataset.id=m.id;row.dataset.time=m.time;const dkey=new Date(m.time).toLocaleDateString("ko-KR");if(dkey!==lastMessageDate){const div=document.createElement("div");div.className="date-divider";div.textContent=formatMessageDate(m.time);messages.append(div);lastMessageDate=dkey}const b=document.createElement('div');b.className='bubble';if(m.image){const img=document.createElement('img');img.src=m.image;img.alt='첨부 이미지';b.append(img)}addMedia(b,m);if(m.text)b.append(linkify(String(m.text)));const meta=document.createElement("div");meta.className="msg-meta";meta.textContent=formatMessageTime(m.time);b.append(meta);if(m.name===me){const del=document.createElement('button');del.className='delete-btn';if(!canEditDelete(m.time))del.classList.add('expired');del.type='button';del.textContent='삭제';del.onclick=()=>{if(!canEditDelete(m.time))return;if(confirm('이 메시지를 삭제할까요?')){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'delete',messageId:m.id,name:me}))}};b.append(del)}row.append(b);messages.append(row);scrollToLatest()}function removeMessage(id){document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.remove()}function connect(){if(socket&&socket.readyState<=1)return;setConnection(false);socket=new WebSocket(API.replace(/^http/,'ws')+'/ws?room=default');socket.onopen=()=>setConnection(true);socket.onclose=()=>{setConnection(false);setTimeout(connect,2000)};socket.onerror=()=>setConnection(false);socket.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='history')x.messages.forEach(addMessage);if(x.type==='message')addMessage(x.message);if(x.type==='delete')removeMessage(x.messageId)}}function b64ToBytes(s){const pad='='.repeat((4-s.length%4)%4),raw=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}function toB64Url(buf){const bytes=new Uint8Array(buf),bin=Array.from(bytes,c=>String.fromCharCode(c)).join('');return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function registerPush(){if(me!=='승수'||!('serviceWorker'in navigator)||!('PushManager'in window)){return}try{await navigator.serviceWorker.register('/sw.js');if(Notification.permission==='granted')await subscribePush(false);else pushBtn.classList.remove('hidden')}catch(e){pushBtn.classList.remove('hidden');pushBtn.title='알림 설정 실패'}}async function subscribePush(ask=true){if(me!=='승수')return;try{if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))return alert('이 브라우저에서는 푸시 알림을 지원하지 않아요.');let permission=Notification.permission;if(ask&&permission!=='granted')permission=await Notification.requestPermission();if(permission!=='granted')return;if(!await navigator.serviceWorker.getRegistration())await navigator.serviceWorker.register('/sw.js');const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_PUBLIC_KEY)});const subscription={endpoint:sub.endpoint,keys:{p256dh:toB64Url(sub.getKey('p256dh')),auth:toB64Url(sub.getKey('auth'))}};const r=await fetch(API+'/api/push/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'승수',subscription})});if(!r.ok)throw new Error('subscribe failed');pushBtn.textContent='🔔';pushBtn.title='알림 켜짐';pushBtn.classList.remove('hidden')}catch(e){console.error(e);alert('알림 설정에 실패했어요. 브라우저 알림 권한을 확인해주세요.')}}function start(){me=name.value.trim();if(!me)return;localStorage.setItem('gomchat-name',me);login.classList.add('hidden');connect();registerPush();text.focus()}if(me){login.classList.add('hidden');connect();registerPush()}$('#enter').onclick=start;name.onkeydown=e=>{if(e.key==='Enter')start()};pushBtn.onclick=()=>subscribePush(true);$('#attach').onclick=()=>file.click();$('#removeImage').onclick=()=>{pendingImage='';pendingMedia='';preview.classList.remove('show');previewImg.src='';file.value=''};file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,1280/img.width,1280/img.height),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.78,d=c.toDataURL('image/jpeg',q);while(d.length>380000&&q>.45){q-=.06;d=c.toDataURL('image/jpeg',q)}pendingImage=d;pendingMedia='';previewImg.src=d;preview.classList.add('show')};img.src=r.result};r.readAsDataURL(f);return}if(f.type==='audio/mpeg'||f.type==='audio/mp3'||f.type==='video/mp4'||f.type==='audio/mp4'){if(f.size>5*1024*1024){alert('MP3/MP4는 5MB 이하만 보낼 수 있어요.');file.value='';return}const r=new FileReader();r.onload=()=>{pendingMedia=r.result;pendingImage='';preview.classList.add('show')};r.readAsDataURL(f)}};text.addEventListener('input',()=>{text.style.height='auto';text.style.height=Math.min(text.scrollHeight,120)+'px'});$('#form').onsubmit=e=>{e.preventDefault();const v=text.value.trim();if((!v&&!pendingImage&&!pendingMedia)||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:'message',name:me,text:v,image:pendingImage,media:pendingMedia}));text.value='';text.style.height='auto';pendingImage='';pendingMedia='';preview.classList.remove('show');previewImg.src='';file.value=''}</script><script src="./chat-theme.js"></script></body></html>
