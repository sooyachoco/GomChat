<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f0"><title>GomChat</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eee5da}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#463b34}.app{width:min(100%,520px);height:100dvh;margin:auto;background:#fffaf5;display:flex;flex-direction:column;box-shadow:0 0 40px #5b463522}.top{height:82px;flex:none;padding:12px 18px;display:flex;align-items:center;gap:12px;background:#fff8f0;border-bottom:1px solid #eee1d5}.back{font-size:28px;color:#9a8879}.avatar{width:46px;height:46px;border-radius:50%;background:#ead8c3;display:grid;place-items:center;font-size:24px}.name{font-weight:750;font-size:17px}.status{font-size:12px;color:#a49384;margin-top:3px}.messages{flex:1;min-height:0;overflow:auto;padding:24px 16px 20px;display:flex;flex-direction:column;gap:13px;background:linear-gradient(#fffaf5,#fdf8f2)}.date{text-align:center;font-size:11px;color:#a79789;margin:3px 0 10px}.row{display:flex;align-items:flex-end;gap:6px}.row.me{justify-content:flex-end}.bubble{max-width:76%;padding:12px 15px;border-radius:20px;background:#f0e4d8;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 5px #6b514012}.me .bubble{background:#dfeade}.bubble a{color:#8066b3;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;word-break:break-all}.bubble img{display:block;max-width:100%;width:auto;height:auto;max-height:420px;border-radius:14px;margin:0 0 8px;object-fit:contain}.bubble img:last-child{margin-bottom:0}.time{font-size:10px;color:#a8998c;white-space:nowrap}.empty{margin:auto;text-align:center;color:#a99a8c;font-size:14px;line-height:1.8}.empty strong{display:block;color:#76675c;font-size:16px}.inputbar{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;background:#fff;border-top:1px solid #eee3da}.inputbar input{flex:1;min-width:0;border:1px solid #e4d9ce;background:#fcf8f4;border-radius:25px;padding:13px 16px;outline:none;font-size:15px;color:#463b34}.inputbar button{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:#85705f;color:#fff;font-size:19px}.attach{background:#ead8c3!important;color:#6e5a4c!important;font-size:22px!important}.preview{display:none;padding:8px 12px 0;background:#fff}.preview.show{display:block}.preview img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid #e2d6cb}.preview button{margin-left:8px;border:0;background:transparent;color:#9a8879;font-size:18px;vertical-align:top}.login{position:fixed;z-index:5;inset:0;background:linear-gradient(145deg,#f4e9dd,#fffaf5);display:grid;place-items:center;padding:24px}.card{width:min(390px,100%);padding:34px 28px;background:#fffdf9;border:1px solid #eadfd4;border-radius:28px;box-shadow:0 18px 50px #59453318;text-align:center}.card .mark{font-size:46px}.card h1{margin:12px 0 7px;font-size:27px}.card p{margin:0 0 20px;color:#9a897b;font-size:14px}.card input{width:100%;padding:14px 15px;border:1px solid #e2d6cb;border-radius:14px;background:#fffaf6;font-size:16px;outline:none}.card button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#85705f;color:#fff;font-size:16px;font-weight:700}.hidden{display:none!important}@media(min-width:521px){body{padding:12px 0}.app{height:calc(100dvh - 24px);border-radius:28px;overflow:hidden}}</style></head><body><div id="login" class="login"><div class="card"><div class="mark">🐻</div><h1>GomChat</h1><p>둘만의 작은 대화방에 들어오세요.</p><input id="nickname" maxlength="20" placeholder="닉네임을 입력해주세요"><button id="enter">조용히 들어가기</button></div></div><div class="app"><header class="top"><div class="back">‹</div><div class="avatar">🐻</div><div><div class="name">곰채팅</div><div class="status" id="status">연결 중...</div></div></header><main id="messages" class="messages"><div class="date">오늘</div><div id="empty" class="empty"><strong>아직 아무 말도 없어요.</strong>첫 메시지를 남겨보세요.</div></main><div id="preview" class="preview"><img id="previewImg" alt="선택한 이미지"><button type="button" id="removeImage" aria-label="이미지 취소">×</button></div><form id="form" class="inputbar"><button type="button" class="attach" id="attach" aria-label="이미지 첨부">＋</button><input id="text" autocomplete="off" placeholder="메시지를 남겨보세요"><button aria-label="보내기">➤</button><input id="file" type="file" accept="image/*" hidden></form></div><script>
const API='https://gomchat.sooyachoco.workers.dev',login=document.querySelector('#login'),nickname=document.querySelector('#nickname'),enter=document.querySelector('#enter'),messages=document.querySelector('#messages'),empty=document.querySelector('#empty'),form=document.querySelector('#form'),text=document.querySelector('#text'),status=document.querySelector('#status'),file=document.querySelector('#file'),attach=document.querySelector('#attach'),preview=document.querySelector('#preview'),previewImg=document.querySelector('#previewImg'),removeImage=document.querySelector('#removeImage');let me=localStorage.getItem('gomchat-name')||'',socket=null,pendingImage='';
function linkify(s){const frag=document.createDocumentFragment();const re=/https?:\/\/[^\s<]+/gi;let last=0,m;while((m=re.exec(s))){if(m.index>last)frag.append(document.createTextNode(s.slice(last,m.index)));let raw=m[0],trail='';while(/[.,!?;:)]$/.test(raw)&&!/[()]/.test(raw.slice(-1))){trail=raw.slice(-1)+trail;raw=raw.slice(0,-1)}const a=document.createElement('a');a.href=raw;a.textContent=raw;a.target='_blank';a.rel='noopener noreferrer';frag.append(a);if(trail)frag.append(document.createTextNode(trail));last=m.index+m[0].length}if(last<s.length)frag.append(document.createTextNode(s.slice(last)));return frag}
function addMessage(m){empty.classList.add('hidden');const row=document.createElement('div');row.className='row '+(m.name===me?'me':'');const b=document.createElement('div');b.className='bubble';if(m.image&&m.image.startsWith('data:image/')){const img=document.createElement('img');img.src=m.image;img.alt='첨부 이미지';img.loading='lazy';b.append(img)}if(m.text)b.append(linkify(String(m.text)));const t=document.createElement('span');t.className='time';t.textContent=new Date(m.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});row.append(m.name===me?t:b,m.name===me?b:t);messages.append(row);messages.scrollTop=messages.scrollHeight}
function connect(){if(socket&&socket.readyState<=1)return;const proto=location.protocol==='https:'?'wss':'ws';const endpoint=API.replace(/^https?:/,proto)+`/ws?room=default`;socket=new WebSocket(endpoint);socket.onopen=()=>status.textContent='실시간 연결됨';socket.onclose=()=>{status.textContent='재연결 중...';setTimeout(connect,2000)};socket.onerror=()=>status.textContent='연결 확인 중...';socket.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='history')x.messages.forEach(addMessage);if(x.type==='message')addMessage(x.message)}}
function start(){me=nickname.value.trim();if(!me)return;localStorage.setItem('gomchat-name',me);login.classList.add('hidden');connect();text.focus()}if(me){login.classList.add('hidden');connect()}enter.onclick=start;nickname.addEventListener('keydown',e=>{if(e.key==='Enter')start()});
attach.onclick=()=>file.click();removeImage.onclick=()=>{pendingImage='';preview.classList.remove('show');previewImg.removeAttribute('src');file.value=''};
file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;if(!f.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,scale=Math.min(1,max/img.width,max/img.height),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=.78,data=c.toDataURL('image/jpeg',q);while(data.length>380000&&q>.45){q-=.06;data=c.toDataURL('image/jpeg',q)}pendingImage=data;previewImg.src=data;preview.classList.add('show')};img.src=reader.result};reader.readAsDataURL(f)};
form.onsubmit=e=>{e.preventDefault();const v=text.value.trim();if((!v&&!pendingImage)||!socket||socket.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:'message',name:me,text:v,image:pendingImage}));text.value='';pendingImage='';preview.classList.remove('show');previewImg.removeAttribute('src');file.value=''};
</script></body></html>
