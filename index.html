<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GomChat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee5da;color:#463b34;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{width:min(100%,520px);height:100dvh;margin:auto;background:#fffaf5;display:flex;flex-direction:column;box-shadow:0 0 40px #5b463522}.top{height:82px;padding:12px 18px;display:flex;align-items:center;gap:12px;background:#fff8f0;border-bottom:1px solid #eee1d5}.back{font-size:22px;color:#8e7c6d}.avatar{width:46px;height:46px;border-radius:50%;background:#ead8c3;display:grid;place-items:center;font-size:24px}.name{font-weight:750;font-size:17px}.status{font-size:12px;color:#a49384;margin-top:3px}.messages{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:13px;background:linear-gradient(#fffaf5,#fdf8f2)}.date{text-align:center;font-size:11px;color:#a79789;margin:3px 0 10px}.row{display:flex;align-items:flex-end;gap:6px}.row.me{justify-content:flex-end}.bubble{max-width:76%;padding:12px 15px;border-radius:20px;background:#f0e4d8;line-height:1.5;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 5px #6b514012}.me .bubble{background:#dfeade}.time{font-size:10px;color:#a8998c;white-space:nowrap}.empty{margin:auto;text-align:center;color:#a99a8c;font-size:14px;line-height:1.8}.empty strong{display:block;color:#76675c;font-size:16px}.inputbar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;background:#fff;border-top:1px solid #eee3da}.inputbar input{flex:1;border:1px solid #e4d9ce;background:#fcf8f4;border-radius:25px;padding:13px 16px;outline:none;font-size:15px;color:#463b34}.inputbar input:focus{border-color:#cdb9a7}.inputbar button{width:48px;height:48px;border:0;border-radius:50%;background:#85705f;color:#fff;font-size:19px;box-shadow:0 4px 10px #5b46352b}.login{position:fixed;z-index:5;inset:0;background:linear-gradient(145deg,#f4e9dd,#fffaf5);display:grid;place-items:center;padding:24px}.card{width:min(390px,100%);padding:34px 28px;background:#fffdf9;border:1px solid #eadfd4;border-radius:28px;box-shadow:0 18px 50px #59453318;text-align:center}.card .mark{font-size:46px}.card h1{margin:12px 0 7px;font-size:27px}.card p{margin:0 0 20px;color:#9a897b;font-size:14px}.card input{width:100%;padding:14px 15px;border:1px solid #e2d6cb;border-radius:14px;background:#fffaf6;font-size:16px;outline:none}.card button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:#85705f;color:#fff;font-size:16px;font-weight:700}.hidden{display:none!important}@media(min-width:521px){body{padding:12px 0}.app{height:calc(100dvh - 24px);border-radius:28px;overflow:hidden}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="mark">🐻</div><h1>GomChat</h1><p>둘만의 작은 대화방에 들어오세요.</p><input id="nickname" maxlength="20" placeholder="닉네임을 입력해주세요"><button id="enter">조용히 들어가기</button></div></div>
<div class="app"><header class="top"><div class="back">‹</div><div class="avatar">🐻</div><div><div class="name">곰채팅</div><div class="status">천천히, 편하게 이야기해요</div></div></header><main id="messages" class="messages"><div class="date">오늘</div><div id="empty" class="empty"><strong>아직 아무 말도 없어요.</strong>첫 메시지를 남겨보세요.</div></main><form id="form" class="inputbar"><input id="text" autocomplete="off" placeholder="메시지를 남겨보세요"><button aria-label="보내기">➤</button></form></div>
<script>
const login=document.querySelector('#login'),nickname=document.querySelector('#nickname'),enter=document.querySelector('#enter'),messages=document.querySelector('#messages'),empty=document.querySelector('#empty'),form=document.querySelector('#form'),text=document.querySelector('#text');let me=localStorage.getItem('gomchat-name')||'',data=JSON.parse(localStorage.getItem('gomchat-messages')||'[]');
function render(){messages.querySelectorAll('.row').forEach(e=>e.remove());empty.classList.toggle('hidden',data.length>0);data.forEach(m=>{const row=document.createElement('div');row.className='row '+(m.name===me?'me':'');const b=document.createElement('div');b.className='bubble';b.textContent=m.text;const t=document.createElement('span');t.className='time';t.textContent=new Date(m.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});row.append(m.name===me?t:b,m.name===me?b:t);messages.append(row)});messages.scrollTop=messages.scrollHeight}
function start(){me=nickname.value.trim();if(!me)return;localStorage.setItem('gomchat-name',me);login.classList.add('hidden');render();text.focus()}if(me)login.classList.add('hidden');render();enter.onclick=start;nickname.addEventListener('keydown',e=>{if(e.key==='Enter')start()});form.onsubmit=e=>{e.preventDefault();const v=text.value.trim();if(!v)return;data.push({name:me,text:v,time:new Date().toISOString()});localStorage.setItem('gomchat-messages',JSON.stringify(data));text.value='';render()};
</script></body></html>
