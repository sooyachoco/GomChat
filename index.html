<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GomChat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#3f3832}.app{max-width:520px;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 30px #00000012}.top{padding:18px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;background:#ead7c1;display:grid;place-items:center;font-size:22px}.name{font-weight:700}.status{font-size:12px;color:#9a8d81;margin-top:3px}.messages{flex:1;overflow:auto;padding:22px 16px;display:flex;flex-direction:column;gap:10px;background:#fcfaf7}.row{display:flex;align-items:flex-end;gap:6px}.row.me{justify-content:flex-end}.bubble{max-width:78%;padding:11px 14px;border-radius:18px;background:#eee8e1;white-space:pre-wrap;word-break:break-word;line-height:1.45}.me .bubble{background:#d9eee0}.time{font-size:10px;color:#aaa;white-space:nowrap}.empty{margin:auto;color:#aaa;font-size:14px}.inputbar{padding:10px;border-top:1px solid #eee;display:flex;gap:8px;background:#fff}.inputbar input{flex:1;border:1px solid #ddd;border-radius:22px;padding:12px 15px;outline:none;font-size:15px}.inputbar button{width:46px;border:0;border-radius:50%;background:#5f7765;color:white;font-size:19px}.login{position:fixed;inset:0;background:#f5f1eb;display:grid;place-items:center;padding:24px}.card{width:min(400px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 10px 40px #0001}.card h1{margin:0 0 8px}.card p{color:#8b8178}.card input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:12px 0;font-size:16px}.card button{width:100%;padding:13px;border:0;border-radius:12px;background:#5f7765;color:#fff;font-size:16px;font-weight:700}.hidden{display:none}
</style>
</head>
<body>
<div id="login" class="login"><div class="card"><h1>GomChat 💬</h1><p>닉네임을 입력하고 1:1 채팅을 시작해보세요.</p><input id="nickname" maxlength="20" placeholder="닉네임"><button id="enter">입장하기</button></div></div>
<div class="app"><header class="top"><div class="avatar">🐻</div><div><div class="name">곰채팅</div><div class="status">1:1 대화</div></div></header><main id="messages" class="messages"><div id="empty" class="empty">첫 메시지를 남겨보세요.</div></main><form id="form" class="inputbar"><input id="text" autocomplete="off" placeholder="메시지를 입력하세요"><button aria-label="보내기">➤</button></form></div>
<script>
const login=document.querySelector('#login'), nickname=document.querySelector('#nickname'), enter=document.querySelector('#enter'), messages=document.querySelector('#messages'), empty=document.querySelector('#empty'), form=document.querySelector('#form'), text=document.querySelector('#text');
let me=localStorage.getItem('gomchat-name')||'';
let data=JSON.parse(localStorage.getItem('gomchat-messages')||'[]');
function render(){messages.querySelectorAll('.row').forEach(e=>e.remove());empty.classList.toggle('hidden',data.length>0);data.forEach(m=>{const row=document.createElement('div');row.className='row '+(m.name===me?'me':'');const b=document.createElement('div');b.className='bubble';b.textContent=m.text;const t=document.createElement('span');t.className='time';t.textContent=new Date(m.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});row.append(m.name===me?t:b,m.name===me?b:t);messages.append(row)});messages.scrollTop=messages.scrollHeight}
function start(){me=nickname.value.trim();if(!me)return;localStorage.setItem('gomchat-name',me);login.classList.add('hidden');render();text.focus()}
if(me){login.classList.add('hidden');render()}
enter.onclick=start;nickname.addEventListener('keydown',e=>{if(e.key==='Enter')start()});
form.onsubmit=e=>{e.preventDefault();const v=text.value.trim();if(!v)return;data.push({name:me,text:v,time:new Date().toISOString()});localStorage.setItem('gomchat-messages',JSON.stringify(data));text.value='';render()};
</script>
</body></html>
